# Base Rules
$center-float-large = match:class ^(center-float-large)$|^(.*qimgv.*)$|^(.*mpv.*)$
windowrule = float on, $center-float-large
windowrule = size 70% 70%, $center-float-large
windowrule = center on, $center-float-large

$center-float = match:class ^(center-float)$
$center-float-title = match:title ^(.*Open Folder.*)$|^(.*Open File.*)$|^(.*Save File.*)$|^(.*Save Folder.*)$|^(.*Save Image.*)$|^(.*Save As.*)$|^(.*Open As.*)$
windowrule = float on, $center-float
windowrule = float on, $center-float-title
windowrule = size 50% 50%, $center-float
windowrule = size 50% 50%, $center-float-title
windowrule = center on, $center-float
windowrule = center on, $center-float-title

$center-float-mini = match:class ^(center-float-mini)$|^(.*galculator.*)$|^(.*ytdlp-gui.*)$|^(.*udiskie.*)$|^(.*Calculator.*)$
windowrule = float on, $center-float-mini
windowrule = size 30% 40%, $center-float-mini
windowrule = center on, $center-float-mini


# Float Rules
# windowrule = float, xfce-polkit|wleave|title:branchdialog|nwg-look|nm-connection-editor|org.twosheds.iwgtk|overskride


# Workspace Rules
## System
windowrule = workspace 8, match:class ^(.*virt-manager.*)$|(.*PikaBackup.*)$|(.*VirtualBox Manager.*)$|(.*Vmware*)$
windowrule = workspace 17, match:class ^(.*GParted.*)$|(.*clamtk.*)$|(.*gnome.Logs.*)$

## Gaming
windowrule = workspace 7, match:class ^(.*steam_app.*)$|(.*gamescope.*)$|(.*atlauncher.*)$|(.*Minecraft.*)$
windowrule = workspace 16 silent, match:class ^([Ss]team)$|(.*heroic.*)$
windowrule = workspace 7, match:class ^(.*Ryujinx.*)$|(.*cemu.*)$|(.*dolphin.*)$|(.*RetroArch.*)$|(.*xemu.*)$|(.*duckstation.*)$|(.*rpcs3.*)$

## Media
windowrule = workspace 6, match:class ^(.*kdenlive.*)$
windowrule = workspace 21 silent, match:class ^(.*thunderbird.*)$
windowrule = workspace 22 silent, match:class ^(.*btop.*)$
windowrule = workspace 22 silent, match:class ^(.*nvtop.*)$
windowrule = workspace 19 silent, match:class ^(.*[Ss]potify.*)$|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)$
windowrule = workspace 20 silent, match:class ^(.*discord.*)$|(.*vesktop.*)$|(.*WebCord.*)$
windowrule = workspace 15, match:class ^(.*obsproject.*)$
windowrule = workspace 14, match:class ^(.*easyeffects.*)$|^(.*qpwgraph.*)$|(.*Helvum.*)$
windowrule = workspace 5, match:class ^(.*vital.*)$|(.*fl64.*)$|(.*nicotine_plus.*)$
windowrule = workspace 5, match:title ^(.*FL Studio.*)$
windowrule = workspace 4, match:class ^(.*pinta.*)$|(.*krita.*)$|(.*blender.*)$|(.*Upscayl.*)$

## Productivity/Dev
windowrule = workspace 9 silent, match:class ^(.*obsidian.*)$|(.*Zotero.*)$
windowrule = workspace 2, match:class ^(.*Code.*)$|(.*codium.*)$|(.*VSCodium.*)$|(.*neovide.*)$


# Animation Rules
windowrule = animation slide, match:title ^(.*cava.*)$
windowrule = animation popin, match:class ^(.*wleave.*)$


# Scratchpads
$scratchpad-large = match:class ^(scratchpad-large)$
windowrule = float on, $scratchpad-large
windowrule = center on, $scratchpad-large
windowrule = size 70% 70%, $scratchpad-large
windowrule = animation slide, $scratchpad-large
windowrule = workspace special:scratchpad-large silent, $scratchpad-large

$scratchpad = match:class ^(scratchpad)$
windowrule = float on, $scratchpad
windowrule = center on, $scratchpad
windowrule = size 50% 50%, $scratchpad
windowrule = animation slide, $scratchpad
windowrule = workspace special:scratchpad silent, $scratchpad

$scratchpad-mini = match:class ^(scratchpad-mini)$
windowrule = float on, $scratchpad-mini
windowrule = center on, $scratchpad-mini
windowrule = size 30% 40%, $scratchpad-mini
windowrule = animation slide, $scratchpad-mini
windowrule = workspace special:scratchpad-mini silent, $scratchpad-mini

$sideScratchpad = match:class ^(.*pavucontrol.*)$|(.*blueman-manager.*)$
windowrule = workspace special:scratchpad silent, $sideScratchpad
windowrule = size 30% 90%, $sideScratchpad
windowrule = float on, $sideScratchpad
windowrule = center on, $sideScratchpad


# Specific App Rules
$videobridge = match:class ^(.*xwaylandvideobridge.*)$
windowrule = opacity 0.0 override 0.0 override, $videobridge
windowrule = no_anim on, $videobridge
windowrule = no_blur on, $videobridge
windowrule = no_initial_focus on, $videobridge
windowrule = max_size 1 1, $videobridge

$zathura = match:class ^(.*zathura.*)$
windowrule = float on, $zathura
windowrule = size 35% 90%, $zathura
windowrule = center on, $zathura

$scrcpy = match:class ^(.*scrcpy.*)$
windowrule = center on, $scrcpy
windowrule = float on, $scrcpy

windowrule = no_initial_focus on, match:class (.*[Ss]potify.*)|(.*tidal-hifi.*)$|(.*You[Tt]ube Music.*)

windowrule = idle_inhibit always, match:class ^(.*steam_app.*)$
windowrule = idle_inhibit fullscreen, match:class ^(.*celluloid.*)$|^(.*mpv.*)$|^(.*vlc.*)$
windowrule = idle_inhibit fullscreen, match:class ^(.*[Ss]potify.*)$
windowrule = idle_inhibit fullscreen, match:class ^(.*LibreWolf.*)$|^(.*floorp.*)$|^(.*Brave.*)$|^(.*firefox.*)$|^(.*chromium.*)$|^(.*zen-alpha.*)$

windowrule = immediate on, match:class ^(.*steam_app.*)$


# Layer Rules
layerrule = animation popin, match:namespace rofi
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar

layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = animation slide, match:namespace swaync-control-center

layerrule = animation slide, match:namespace swaync-notification-window

layerrule = animation fade, match:namespace swayosd

layerrule = animation fade, match:namespace selection
layerrule = animation fade, match:namespace hyprlock

layerrule = no_anim on, match:namespace hyprpicker
